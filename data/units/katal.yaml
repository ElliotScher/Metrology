id: katal
name: Katal
symbols: [kat]
system: SI-derived
domain: chemistry
dimension: { length: 0, mass: 0, time: -1, current: 0, temperature: 0, amount: 1, luminous_intensity: 0 }
derived_from:
  - { id: mole, power: 1 }
  - { id: second, power: -1 }
equation: "kat = mol/s"
definitions:
  - era: "1999–present"
    value: "The catalytic activity that increases the rate of conversion of a specified chemical reaction by one mole per second in a specified assay system."
    basis: coherent-derived
    current: true
    source: "21st CGPM (1999), Resolution 12; BIPM SI Brochure, 9th ed. (2019)."
notes:
  etymology: "From 'catalysis', via Greek 'katalyein', meaning to dissolve/loosen."
  cursedness: "The newest of the SI derived units with special names, added in 1999 specifically to standardize enzyme-activity measurements in biochemistry — most SI derived units are two centuries older."
status: verified
sources: ["BIPM SI Brochure, 9th ed. (2019)"]
