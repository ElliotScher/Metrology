id: mile
name: "Mile"
symbols: ["mi"]
system: imperial
domain: length
dimension: { length: 1, mass: 0, time: 0, current: 0, temperature: 0, amount: 0, luminous_intensity: 0 }
derived_from:
  - { id: furlong, power: 1 }
factor: 8
equation: "mi = 8 fur"
definitions:
  - era: "1593–1959"
    value: "Eight furlongs of 40 perches of 16½ feet, as defined by the statute of Elizabeth I: 5280 feet of the national standard foot."
    basis: exact-multiple
    current: false
    source: "Weights and Measures Act 1593 (35 Eliz. 1 c. 6)."
  - era: "1959–present"
    value: "Exactly 1609.344 metres (5280 international feet)."
    basis: exact-multiple
    current: true
    source: "International Yard and Pound Agreement (1959); NIST Handbook 44, Appendix C; Weights and Measures Act 1985 (UK), Schedule 1."
notes:
  etymology: "From Latin 'mille passus', a thousand paces (double steps) of a Roman legion."
  cursedness: "The Roman mile was 5000 Roman feet. The English mile became 5280 feet in 1593 only because Parliament wanted it to be a whole number of furlongs. 'Statute mile' distinguishes it from the nautical mile (1852 m), and until 2022 there was also a US survey mile, 3.2 mm longer."
status: verified
sources: ["International Yard and Pound Agreement (1959)", "NIST Handbook 44, Appendix C", "Weights and Measures Act 1985 (UK), Schedule 1"]
