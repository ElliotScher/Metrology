notes:
  etymology: "From Latin 'uncia', a twelfth — the same word as 'inch', though the avoirdupois ounce is a sixteenth."
  cursedness: "There are three ounces: the avoirdupois ounce for groceries, the heavier troy ounce (about 31.1 g) for gold and silver, and the fluid ounce, which is a volume. A troy ounce is heavier than an avoirdupois ounce, but a troy pound is lighter than an avoirdupois pound."
