id: mole
name: Mole
symbols: [mol]
system: SI-base
domain: amount-of-substance
dimension: { length: 0, mass: 0, time: 0, current: 0, temperature: 0, amount: 1, luminous_intensity: 0 }
derived_from: []
equation: null
definitions:
  - era: "1971–2019"
    value: "The amount of substance of a system which contains as many elementary entities as there are atoms in 0.012 kilogram of carbon-12."
    basis: reference-sample
    current: false
    source: "14th CGPM (1971), Resolution 3."
  - era: "2019–present"
    value: "Defined by fixing the numerical value of the Avogadro constant N_A to 6.02214076×10²³ per mole."
    basis: physical-constant
    current: true
    source: "26th CGPM (2018), Resolution 1; BIPM SI Brochure, 9th ed. (2019), sec. 2.3.5."
notes:
  etymology: "From German 'Molekül', coined by Wilhelm Ostwald around 1900 as a short form of 'gram-molecule'."
  cursedness: "Whether the mole should be a unit at all is a matter of convention. Its defining constant, the Avogadro constant N_A = 6.02214076×10²³ mol⁻¹, is a quantity with a unit: entities per mole. Fixing it gives 1 mol = 6.02214076×10²³ / N_A, so the only unit involved is the mole itself, and like the second it depends on no other unit. Drop the unit and N_A becomes the Avogadro number, a plain count, and the mole becomes a counting word like 'dozen'. On that view, amount of substance is not a dimension at all. The SI keeps it as a separate base dimension so that chemistry stays dimensionally consistent, for example molar mass in kg/mol rather than just kg. This is the same kind of choice the SI makes in treating the radian as dimensionless. The mole also depended on the kilogram until 2019 (0.012 kg of carbon-12), so a change in the kilogram changed the mole. The 2019 redefinition removed that link."
status: verified
sources: ["BIPM SI Brochure, 9th ed. (2019)"]
