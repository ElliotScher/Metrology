definitions:
  - era: "1785–present"
    value: "One square mile (640 acres), the basic unit of the US Public Land Survey System."
    basis: exact-multiple
    current: true
    source: "Land Ordinance of 1785; NIST Handbook 44, Appendix C."
notes:
  etymology: "A numbered section of a surveyed township."
  cursedness: "Most of the US west of Ohio is divided into a grid of these, which is why so many rural roads run exactly a mile apart. Because the Earth is curved and the grid isn't, surveyors had to insert 'correction lines' every 24 miles, where north–south roads jog sideways."
