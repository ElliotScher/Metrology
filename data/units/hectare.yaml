id: hectare
name: Hectare
symbols: [ha]
system: SI-accepted
domain: area
dimension: { length: 2, mass: 0, time: 0, current: 0, temperature: 0, amount: 0, luminous_intensity: 0 }
derived_from:
  - { id: metre, power: 2 }
factor: 10000
equation: "ha = 10⁴ m²"
definitions:
  - era: "1795–present"
    value: "A unit of area equal to one square hectometre (10 000 m²), or 100 ares, where the are (a) of the original metric system is 100 m². Accepted for use with the SI."
    basis: exact-multiple
    current: true
    source: "French metric law of 18 Germinal An III (1795) (the are); BIPM SI Brochure, 9th ed. (2019), Table 8."
notes:
  etymology: "'Hect-' (hecto, 100) plus 'are', from Latin 'area'."
  cursedness: "The only survivor of the are, which the SI no longer lists. The hecto prefix is fused into the name, so you can't take it off: there is no accepted unit called the 'are' any more, and a 'kilohectare' isn't allowed."
status: verified
sources: ["BIPM SI Brochure, 9th ed. (2019)"]
